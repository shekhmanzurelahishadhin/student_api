name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test-quality-security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test

      - name: Build Docker Image
        run: docker build -t student-api .

      - name: Run Trivy Scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: student-api
          format: table
          exit-code: 0

      - name: Install OPA
        run: |
          curl -L -o opa https://openpolicyagent.org/downloads/latest/opa_linux_amd64_static
          chmod +x opa

      - name: OPA Policy Check
        run: |
          ./opa eval -i input.json -d policy/docker.rego "data.docker.deny"
